name: Real-Time INMET Station Sync

on:
  schedule:
    # Runs at minute 20 of every hour (allowing INMET stations to transmit hourly packets)
    - cron: '20 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: "inmet-sync"
  cancel-in-progress: false

jobs:
  sync-inmet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies & Playwright
        run: |
          python -m pip install --upgrade pip
          pip install httpx playwright
          playwright install chromium --with-deps

      - name: Run Real-Time INMET Station Sync
        run: |
          python scripts/sync_inmet_realtime.py

      - name: Commit & Push fresh station observations
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add static/data/stations/
          if git diff --staged --quiet; then
            echo "Zero changes in physical station observations."
          else
            git commit -m "chore(telemetry): auto-sync real-time INMET observations [skip ci]"
            git push origin main
          fi

